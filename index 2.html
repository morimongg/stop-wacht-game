<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>ぴったりストップウォッチ</title><style>*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:linear-gradient(135deg,#111827,#1f2937);color:#fff}.app{max-width:760px;margin:auto;padding:18px;text-align:center}.card{background:rgba(255,255,255,.1);padding:20px;border-radius:24px;margin:16px 0}.screen{background:rgba(0,0,0,.35);padding:60px 10px;border-radius:24px;font-size:48px;font-weight:900;margin:20px 0}.buttons,.move{display:grid;grid-template-columns:1fr 1fr;gap:10px}button,select,input{width:100%;padding:14px;border-radius:14px;border:none;margin:6px 0;font-size:16px}.start{background:#10b981;color:#fff;font-size:22px}.stop{background:#f43f5e;color:#fff;font-size:22px}.host{background:#fbbf24}.rank{background:rgba(255,255,255,.12);padding:12px;border-radius:14px;margin:8px 0;display:flex;justify-content:space-between}.big{font-size:48px;font-weight:900}</style></head><body><div class='app'><h1>ぴったりストップウォッチ</h1><div class='card'><h2 id='teamName'>1チーム</h2><div id='targetText'>目標：10秒</div><div class='screen' id='screen'>READY</div><div class='buttons'><button class='start' id='startBtn'>START</button><button class='stop' id='stopBtn' disabled>STOP</button></div><div class='move'><button id='prevBtn'>前のチーム</button><button id='nextBtn'>次のチーム</button></div></div><div class='card'><h3>設定</h3><label>目標秒数：<span id='targetNum'>10</span>秒</label><input type='range' min='1' max='30' step='1' value='10' id='targetRange'><select id='teamCount'><option value='6'>6チーム</option><option value='7'>7チーム</option><option value='8' selected>8チーム</option></select><div id='teamInputs'></div><button class='host' id='hostBtn'>幹事パネルを見る</button></div><div class='card' id='hostPanel' style='display:none'><h2>幹事パネル</h2><div id='latestResult'>まだ結果はありません</div><h3>順位（80秒に近い順）</h3><div id='ranking'></div><button id='resetBtn'>全リセット</button></div></div><script>let target=10,teamCount=8,teams=['1チーム','2チーム','3チーム','4チーム','5チーム','6チーム','7チーム','8チーム'],totals=[0,0,0,0,0,0,0,0],current=0,running=false,startTime=0,result=null,showHost=false;const $=id=>document.getElementById(id);function render(){$('teamName').textContent=teams[current];$('targetText').textContent=`目標：${target}秒`;$('targetNum').textContent=target;$('screen').textContent=running?'計測中…':result!==null?'STOP!':'READY';$('startBtn').disabled=running;$('stopBtn').disabled=!running;$('prevBtn').disabled=current===0;$('nextBtn').disabled=current===teamCount-1;$('hostPanel').style.display=showHost?'block':'none';$('latestResult').innerHTML=result!==null?`<div class='big'>${result.toFixed(2)}秒</div><p>チーム合計：${totals[current].toFixed(2)}秒</p>`:'まだ結果はありません';const ranking=teams.slice(0,teamCount).map((team,i)=>({team,total:totals[i],diff:Math.abs(80-totals[i])})).sort((a,b)=>a.diff-b.diff);$('ranking').innerHTML=ranking.map((r,i)=>`<div class='rank'><b>${i+1}位 ${r.team}</b><span>${r.total.toFixed(2)}秒</span></div>`).join('');$('teamInputs').innerHTML=teams.slice(0,teamCount).map((t,i)=>`<input value='${t}' data-i='${i}'>`).join('');document.querySelectorAll('#teamInputs input').forEach(input=>{input.oninput=e=>{teams[Number(e.target.dataset.i)]=e.target.value;render();};});}$('targetRange').oninput=e=>{target=Number(e.target.value);render();};$('teamCount').onchange=e=>{teamCount=Number(e.target.value);render();};$('startBtn').onclick=()=>{result=null;startTime=performance.now();running=true;render();};$('stopBtn').onclick=()=>{result=Number(((performance.now()-startTime)/1000).toFixed(2));running=false;totals[current]+=result;render();};$('prevBtn').onclick=()=>{current=Math.max(0,current-1);result=null;render();};$('nextBtn').onclick=()=>{current=Math.min(teamCount-1,current+1);result=null;render();};$('hostBtn').onclick=()=>{showHost=!showHost;render();};$('resetBtn').onclick=()=>{totals=[0,0,0,0,0,0,0,0];result=null;current=0;running=false;render();};render();</script></body></html>
